# Publishes the page on GitHub Pages every time main changes.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions"
# (the first run tries to switch that on for you).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page files (tests, backend and notes stay out)
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js config.js .nojekyll _site/
          cp data/*.js _site/data/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
